version: '3.9'

services:
  grafana:
    build: ./docker/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      monitoring:
        aliases:
          - grafana
  prometheus:
    image: prom/prometheus:v2.44.0
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      monitoring:
        aliases:
          - prometheus
  postgres:
    image: postgres:17-alpine
    container_name: metric-grimoire-postgres
    environment:
      POSTGRES_USER: "metric-grimoire"
      POSTGRES_PASSWORD: "some-cool-password"
      POSTGRES_DB: "metric-grimoire"
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d metric-grimoire" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    volumes:
      - postgres-data:/var/lib/postgresql/data
networks:
  monitoring:

volumes:
  grafana-data:
  prometheus-data:
  postgres-data:
